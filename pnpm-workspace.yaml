packages:
  - "bindings/wasm/js"
  - "bridges/*"
  - "transports/javascript"
  - "adapters/*"
  - "renderers/web"
  - "examples/expo"
  - "examples/react-native"
  - "examples/web"

onlyBuiltDependencies:
  - esbuild

# pnpm 12+: build-script allowlists live here, not in package.json.
# esbuild's postinstall is required by vitest.
allowBuilds:
  esbuild: true
