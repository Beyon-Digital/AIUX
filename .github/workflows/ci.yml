name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap diff-based gate: each heavyweight lane only runs when the files it
  # can break actually changed. Lane → job mapping lives in
  # tools/ci-changes.mjs; unresolvable diffs run everything.
  detect:
    name: Detect affected lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proto: ${{ steps.d.outputs.proto }}
      rust: ${{ steps.d.outputs.rust }}
      swift: ${{ steps.d.outputs.swift }}
      kotlin: ${{ steps.d.outputs.kotlin }}
      js: ${{ steps.d.outputs.js }}
      web: ${{ steps.d.outputs.web }}
      expo: ${{ steps.d.outputs.expo }}
      flutter: ${{ steps.d.outputs.flutter }}
      conformance: ${{ steps.d.outputs.conformance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        run: node tools/ci-changes.mjs

  protocol-validate:
    name: Protocol schema validation
    needs: detect
    if: needs.detect.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Validate protocol schemas, manifest + fixtures
        # Compiles every schema (malformed definitions fail), cross-checks the
        # v1 manifest against events/*.json, and schema-validates every
        # conformance fixture event — not just JSON.parse.
        run: node tools/validate-protocol.mjs

  rust:
    name: Rust fmt / clippy / test
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - name: Clean Rust Git consumer
        env:
          AIUX_CONSUMER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          AIUX_CONSUMER_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}', github.repository) }}
        run: bash tools/git-consumers.sh rust

  swift-bindings:
    name: Swift bindings + tests
    needs: detect
    if: needs.detect.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate UniFFI Swift bindings
        run: |
          if [ -f bindings/swift/generate.sh ]; then
            bash bindings/swift/generate.sh
          else
            echo "No Swift binding generator yet — Phase 2 deliverable."
          fi
      - name: Swift package build + tests
        run: |
          set -e
          for pkg in renderers/swiftui examples/ios-native bindings/swift; do
            if [ -f "$pkg/Package.swift" ]; then
              echo "== swift build/test in $pkg"
              (cd "$pkg" && swift build && \
                if [ -d Tests ]; then swift test; else echo "No Tests dir — skipping swift test."; fi)
            else
              echo "No Package.swift in $pkg — skipping."
            fi
          done

  kotlin-bindings:
    name: Kotlin bindings + Gradle
    needs: detect
    if: needs.detect.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: UniFFI Kotlin binding generation + native libs
        run: bash bindings/kotlin/generate.sh
      - name: Gradle build
        run: |
          if [ -x ./gradlew ]; then ./gradlew build --no-daemon; else echo "No gradlew yet — skipping."; fi

  js:
    name: JS typecheck + test
    needs: detect
    if: needs.detect.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!@beyond-digital/aiux-example-*' --if-present build
      - run: node tools/release-check.mjs
      - run: node --test tools/publish-js.test.mjs tools/assemble-release.test.mjs tools/complete-release.test.mjs tools/release-manifest.test.mjs tools/ci-changes.test.mjs
      - run: pnpm run typecheck
      - run: pnpm run test

  web-build:
    name: Web renderer build
    needs: detect
    # Builds every workspace package (`pnpm -r run build`) — JS changes count.
    if: needs.detect.outputs.web == 'true' || needs.detect.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (must match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: pnpm install --frozen-lockfile
      - name: Build web packages
        # aiux-web dist + the example's vite build; the example wires
        # aiux-wasm → bindings/wasm/pkg → aiux-core ./wasm export.
        run: pnpm -r run build
      - run: node bindings/wasm/js/scripts/copy-wasm.mjs
      - name: Web renderer tests (incl. wasm conformance gate)
        run: pnpm --filter "@beyond-digital/aiux-web" run test

  expo-android:
    name: Expo Android compile
    needs: detect
    if: needs.detect.outputs.expo == 'true' || needs.detect.outputs.kotlin == 'true'
    runs-on: ubuntu-latest

    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      # Expo autolinking resolves the workspace module via Node during
      # settings evaluation — the JS deps must exist before Gradle runs.
      - run: pnpm install --frozen-lockfile
      # AGP's on-demand SDK install is flaky on fresh runners — install the
      # components expo-modules-core needs explicitly first.
      - name: Install Android SDK components (cmake + NDK)
        run: |
          # pipefail is off around `yes |` so yes's expected SIGPIPE (141)
          # doesn't mask sdkmanager's real exit status.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "cmake;3.22.1" "ndk;27.1.12297006"
          sdk_rc=$?
          set -o pipefail
          [ "$sdk_rc" -eq 0 ]
      - name: Compile Android
        run: cd examples/expo/android && ./gradlew assembleDebug --no-daemon

  expo-ios:
    name: Expo iOS compile
    needs: detect
    if: needs.detect.outputs.expo == 'true' || needs.detect.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Stage UniFFI Swift bindings + AIUXCore.xcframework
        run: bash bridges/expo/scripts/prepare-ios.sh
      - name: Pods
        run: cd examples/expo/ios && pod install
      - name: Build for iOS Simulator
        run: |
          cd examples/expo/ios
          xcodebuild -workspace AIUXExpoExample.xcworkspace \
            -scheme AIUXExpoExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  flutter:
    name: Dart FFI + Flutter tests
    needs: detect
    if: needs.detect.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build aiux-capi for dart:ffi
        run: bash bindings/dart/generate.sh
      - name: Dart bindings tests (conformance via C ABI)
        run: |
          set -e
          cd bindings/dart
          dart pub get
          dart analyze
          dart test
      - name: Clean Flutter Git consumer with real C ABI
        env:
          AIUX_CONSUMER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          AIUX_CONSUMER_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}', github.repository) }}
          AIUX_CAPI_PATH: ${{ github.workspace }}/target/release/libaiux_capi.so
        run: bash tools/git-consumers.sh flutter
      - name: Flutter renderer analyze + test
        run: |
          set -e
          cd renderers/flutter
          flutter pub get
          dart analyze
          flutter test
      - name: Example app analyze + test
        run: |
          set -e
          cd examples/flutter
          flutter pub get
          dart analyze
          flutter test

  flutter-goldens:
    name: Flutter golden screenshots
    needs: detect
    if: needs.detect.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build aiux-capi for dart:ffi
        run: bash bindings/dart/generate.sh
      - name: Generate golden screenshots
        run: |
          set -e
          cd renderers/flutter
          flutter pub get
          AIUX_GOLDENS=1 flutter test test/golden_test.dart --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-goldens
          path: renderers/flutter/test/goldens/
          retention-days: 30
          if-no-files-found: error

  conformance:
    name: Fixture conformance
    needs: detect
    if: needs.detect.outputs.conformance == 'true' || needs.detect.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run conformance harness
        run: |
          if [ -f conformance/harness/Cargo.toml ]; then
            cargo run -p aiux-conformance -- verify conformance/fixtures conformance/expected
          else
            echo "No conformance harness yet — Phase 1 deliverable."
          fi
