name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' does not match vX.Y.Z"; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  conformance:
    name: Full conformance suite
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - name: Fixture conformance
        run: |
          if [ -f conformance/harness/Cargo.toml ]; then
            cargo run -p aiux-conformance -- verify conformance/fixtures conformance/expected
          else
            echo "Conformance harness not present yet."
          fi

  build-rust:
    name: Build Rust targets
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: rust-targets
          path: target/release/

  build-apple:
    name: Bindings + XCFramework
    needs: conformance
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate bindings + build XCFramework
        run: echo "Wired in Phase 2 — UniFFI gen → lipo → xcframework."

  build-android:
    name: Android artifact
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          if [ -x ./gradlew ]; then ./gradlew build --no-daemon; else echo "Gradle build wired in Phase 2/3."; fi

  build-js-wasm:
    name: WASM + JS packages
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm run build

  github-release:
    name: GitHub Release + checksums
    needs: [build-rust, build-apple, build-android, build-js-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate checksums + release
        run: |
          echo "Collect all artifacts, sha256sum them, gh release create ${GITHUB_REF_NAME}"
          echo "Internal v0.x: GitHub Releases + GitHub Packages only (plan §20)."
