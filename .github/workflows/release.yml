name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# MIT OSS release — artifacts derive from the tag commit; registry publishing
# is a separate explicitly dispatched job after release evidence is reviewed.

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/release-check.mjs
      - if: startsWith(github.ref, 'refs/tags/')
        run: node tools/release-check.mjs "${GITHUB_REF_NAME}"
      - id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            tag="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' does not match vX.Y.Z"; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  conformance:
    name: Full conformance suite
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - name: Fixture conformance
        run: cargo run -p aiux-conformance -- verify conformance/fixtures conformance/expected

  build-rust:
    name: Build Rust targets
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: node tools/third-party-notices.mjs
      - name: Package native libs
        run: |
          mkdir -p dist/rust
          find target/release -maxdepth 1 -type f \
            \( -name 'libaiux_*.so' -o -name 'libaiux_*.a' \) \
            -exec cp {} dist/rust/ \;
          cp dist/aiux-third-party.tar.gz dist/rust/
          cp LICENSE dist/rust/
          ls -la dist/rust
      - uses: actions/upload-artifact@v4
        with:
          name: rust-targets
          path: dist/rust/
          if-no-files-found: error

  build-apple:
    name: Bindings + XCFramework
    needs: conformance
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Generate UniFFI Swift bindings
        run: bash bindings/swift/generate.sh
      - name: Build AIUXCore.xcframework
        run: bash bindings/swift/package-xcframework.sh
      - name: Package standalone Swift distribution
        run: bash tools/swift-release-package.sh
      - name: Package apple artifacts
        run: |
          mkdir -p dist
          cd bindings/swift/build/xcframework
          zip -r "$GITHUB_WORKSPACE/dist/AIUXCore.xcframework.zip" AIUXCore.xcframework
          cd "$GITHUB_WORKSPACE"
          tar -czf dist/aiux-swift-bindings.tar.gz \
            -C bindings/swift Sources/AIUXCore Sources/AIUXCoreFFI Package.swift
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: apple-artifacts
          path: dist/*.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: apple-xcframework-artifacts
          path: dist/*.zip

  build-android:
    name: Android artifacts (AARs)
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install cargo-ndk + Android NDK
        run: |
          cargo install cargo-ndk --version "^4" --locked
          # sdkmanager isn't on PATH on current ubuntu-latest — call it via
          # ANDROID_HOME like ci.yml does, and pin CI's NDK version.
          # pipefail is off around `yes |` so yes's expected SIGPIPE (141)
          # doesn't mask sdkmanager's real exit status.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "cmake;3.22.1" "ndk;27.1.12297006"
          sdk_rc=$?
          set -o pipefail
          [ "$sdk_rc" -eq 0 ]
      - name: Generate UniFFI Kotlin bindings + NDK slices
        run: bash bindings/kotlin/generate.sh
      - name: Build AARs
        run: ./gradlew :bindings:kotlin:assembleRelease :renderers:compose:assembleRelease --no-daemon
      - name: Publish local Maven repository (AARs + dependency POMs)
        run: ./gradlew :bindings:kotlin:publishReleasePublicationToReleaseRepository :renderers:compose:publishReleasePublicationToReleaseRepository --no-daemon
      - run: node tools/third-party-notices.mjs
      - name: Package android artifacts
        run: |
          mkdir -p dist
          cp bindings/kotlin/build/outputs/aar/*.aar dist/
          cp renderers/compose/build/outputs/aar/*.aar dist/
          tar -czf dist/aiux-kotlin-bindings.tar.gz -C bindings/kotlin/build/generated .
          cp -R dist/third-party dist/maven/LICENSES
          cp LICENSE dist/maven/
          tar -czf dist/aiux-android-maven.tar.gz -C dist maven
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            dist/*.aar
            dist/*.gz
          if-no-files-found: error

  build-js-wasm:
    name: WASM + JS packages
    needs: [conformance, build-apple, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install wasm-bindgen-cli (must match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build wasm core
        run: bash bindings/wasm/build.sh
      - name: Install + build all JS packages
        run: |
          pnpm install --frozen-lockfile=false
          pnpm -r --if-present run build
      - run: node bindings/wasm/js/scripts/copy-wasm.mjs
      - run: node tools/third-party-notices.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: apple*-artifacts
          merge-multiple: true
          path: native/apple
      - uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: native/android
      - run: node tools/stage-native.mjs native/apple native/android
      - name: Pack + verify isolated JS consumer
        run: |
          pnpm release:pack
          pnpm release:smoke
      - name: Package raw WASM artifact
        run: tar -czf dist/aiux-wasm-pkg.tar.gz -C bindings/wasm pkg
      - uses: actions/upload-artifact@v4
        with:
          name: js-artifacts
          path: |
            dist/npm/*
            dist/aiux-wasm-pkg.tar.gz
          if-no-files-found: error

  native-consumers:
    name: Clean Expo consumer (${{ matrix.os }})
    needs: build-js-wasm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: js-artifacts
          path: dist/
      - name: Verify clean Expo app builds from packed native payload
        run: node tools/consumer-smoke.mjs --native

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: GitHub Release + checksums
    needs: [build-rust, build-apple, build-android, build-js-wasm, native-consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # release-notes needs tag history
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: rust-targets
          path: release/rust-targets
      - name: Generate release notes
        run: node tools/release-notes.mjs "" "${GITHUB_REF_NAME}" > release-notes.md
      - name: Checksums
        run: |
          cd release
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # upload files only — `release/**` also matches artifact dirs and
          # `gh release create` fails with "is a directory" on those
          mapfile -t assets < <(find release -type f | sort)
          # Existing release assets are immutable. Retry publication instead of
          # regenerating/overwriting a successfully assembled draft.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; preserving its original assets."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "AIUX ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${assets[@]}" SHA256SUMS
          echo "Draft release created — review + publish to ship."
          echo "npm tarballs validated; dispatch Publish packages after review and scope setup."
