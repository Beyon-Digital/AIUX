name: Recover release upload
on:
  workflow_dispatch:
    inputs:
      original_run:
        description: 'Original tagged Release run whose builds and consumer jobs passed'
        required: true
      release_tag:
        description: 'Existing immutable tag and partial draft (vX.Y.Z)'
        required: true
      finalize_publication:
        description: 'Verify already published bytes and anonymous install, then finalize release'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: recover-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  complete-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify original tagged build and consumer gates
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.original_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$ORIGINAL_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node tools/release-check.mjs "$RELEASE_TAG"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" > original-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN/jobs?per_page=100&filter=all" > original-jobs.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const run=JSON.parse(readFileSync('original-run.json'));
          assert.equal(run.path,'.github/workflows/release.yml');
          assert.equal(run.event,'push');
          assert.equal(run.status,'completed');
          assert.equal(run.head_branch,process.env.RELEASE_TAG);
          assert.equal(run.head_sha,execFileSync('git',['rev-parse',`${process.env.RELEASE_TAG}^{commit}`],{encoding:'utf8'}).trim());
          const jobs=JSON.parse(readFileSync('original-jobs.json')).jobs;
          for(const name of ['Validate release tag','Full conformance suite','Build Rust targets','Bindings + XCFramework','Android artifacts (AARs)','WASM + JS packages','Clean Expo consumer (ubuntu-latest)','Clean Expo consumer (macos-latest)']) assert.equal(jobs.find(j=>j.name===name)?.conclusion,'success',name);
          JS
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.original_run }}
          github-token: ${{ github.token }}
          path: original-artifacts
      - name: Complete original draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node tools/assemble-release.mjs original-artifacts release-assets
          node tools/verify-release-download.mjs release-assets
          node tools/complete-release.mjs "$RELEASE_TAG" release-assets
      - name: Verify existing registry packages and anonymous consumer
        if: inputs.finalize_publication
        run: |
          mkdir -p dist/npm
          cp release-assets/*.tgz release-assets/manifest.json dist/npm/
          node tools/publish-js.mjs --verify-only
          node tools/consumer-smoke.mjs --registry
      - name: Finalize regular release after independent registry verification
        if: inputs.finalize_publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
      - name: Resume original assembly job and normal publishing
        if: ${{ !inputs.finalize_publication }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.original_run }}
        run: gh run rerun "$ORIGINAL_RUN" --failed
