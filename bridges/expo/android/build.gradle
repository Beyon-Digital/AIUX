apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'in.beyondigital.aiux'
version = '0.2.0-rc.1'

buildscript {
  def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  if (expoModulesCorePlugin.exists()) {
    apply(from: expoModulesCorePlugin)
  }

  repositories {
    mavenCentral()
  }

  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'expo-module-gradle-plugin'

android {
  namespace "aiux.expo"

  defaultConfig {
    versionName "0.2.0-rc.1"
  }

  buildFeatures {
    compose true
  }
}

dependencies {
  if (file('vendor/maven').exists()) {
    implementation 'in.beyondigital.aiux:compose:0.2.0-rc.1'
    implementation 'in.beyondigital.aiux:bindings:0.2.0-rc.1'
  } else {
    // Source checkout development uses the example's composite build.
    implementation 'aiux:compose:0.2.0-rc.1'
    implementation 'aiux:bindings:0.2.0-rc.1'
  }

  implementation platform('androidx.compose:compose-bom:2024.12.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
}

// Register for all projects: the consuming app also resolves this pod's AARs.
if (file('vendor/maven').exists()) {
  def aiuxMaven = file('vendor/maven')
  rootProject.allprojects { repositories { maven { url aiuxMaven } } }
}
